services:
  studio:
    build: .
    image: what-if-diffusion-app
    init: true
    # Host networking: the local TTS/translation API (nouveau, :8005) and local media proxies listen on 127.0.0.1.
    network_mode: host
    environment:
      WHATIF_DATA: /data
      WHATIF_HOST: ${WHATIF_HOST:-127.0.0.1}
      WHATIF_PORT: ${WHATIF_PORT:-3020}
      WHATIF_ALLOWED_ORIGINS: ${WHATIF_ALLOWED_ORIGINS:-}
      WHATIF_AUTH_TOKEN: ${WHATIF_AUTH_TOKEN:-}
      WHATIF_PROVIDER: ${WHATIF_PROVIDER:-mock}
      WHATIF_PROVIDERS_FILE: ${WHATIF_PROVIDERS_FILE:-}
      WHATIF_BASE_URL: ${WHATIF_BASE_URL:-}
      WHATIF_MODEL: ${WHATIF_MODEL:-}
      WHATIF_API_KEY: ${WHATIF_API_KEY:-}
      WHATIF_CONTEXT_CHARS: ${WHATIF_CONTEXT_CHARS:-180000}
      # off (défaut) = l'agent va au bout sans rien demander ; pipeline|all = portes d'approbation
      WHATIF_APPROVALS: ${WHATIF_APPROVALS:-off}
      WHATIF_MAX_STEPS: ${WHATIF_MAX_STEPS:-1000}
      WHATIF_MAX_TOKENS: ${WHATIF_MAX_TOKENS:-24000}
      # Diffusion Image (Nano Banana 2 Lite / 2.1) & Vidéo I2V (Omni 1.2 Flash 360p) via gflow :8006
      WHATIF_IMAGE_PROVIDER: ${WHATIF_IMAGE_PROVIDER:-gflow}
      WHATIF_IMAGE_BASE_URL: ${WHATIF_IMAGE_BASE_URL:-http://127.0.0.1:8006}
      WHATIF_IMAGE_API_KEY: ${WHATIF_IMAGE_API_KEY:-}
      WHATIF_IMAGE_MODEL: ${WHATIF_IMAGE_MODEL:-nano2-lite}
      WHATIF_IMAGE_FALLBACK_MODEL: ${WHATIF_IMAGE_FALLBACK_MODEL:-nano2.1}
      WHATIF_IMAGE_REF_MODE: ${WHATIF_IMAGE_REF_MODE:-multi}
      WHATIF_IMAGE_MAX_REFS: ${WHATIF_IMAGE_MAX_REFS:-10}
      WHATIF_GFLOW_PROFILE: ${WHATIF_GFLOW_PROFILE:-}
      WHATIF_VIDEO_PROVIDER: ${WHATIF_VIDEO_PROVIDER:-gflow}
      WHATIF_VIDEO_BASE_URL: ${WHATIF_VIDEO_BASE_URL:-http://127.0.0.1:8006}
      WHATIF_VIDEO_API_KEY: ${WHATIF_VIDEO_API_KEY:-}
      WHATIF_VIDEO_MODEL: ${WHATIF_VIDEO_MODEL:-omni-1.2-flash}
      WHATIF_VIDEO_RESOLUTION: ${WHATIF_VIDEO_RESOLUTION:-360p}
      # Upscaler Anime 2D optionnel (Real-CUGAN / Real-ESRGAN sur Modal GPU)
      WHATIF_UPSCALER_ENABLED: ${WHATIF_UPSCALER_ENABLED:-false}
      WHATIF_UPSCALER_DRIVER: ${WHATIF_UPSCALER_DRIVER:-modal-anime}
      WHATIF_UPSCALER_URL: ${WHATIF_UPSCALER_URL:-https://bkrpulsy--anime-upscaler-t4-fastapi-app.modal.run}
      WHATIF_UPSCALER_API_KEY: ${WHATIF_UPSCALER_API_KEY:-}
      WHATIF_UPSCALER_TARGET: ${WHATIF_UPSCALER_TARGET:-auto-2k}
      WHATIF_UPSCALER_MODEL: ${WHATIF_UPSCALER_MODEL:-real-cugan}
      WHATIF_UPSCALER_DENOISE: ${WHATIF_UPSCALER_DENOISE:-1}
      WHATIF_UPSCALER_GPU: ${WHATIF_UPSCALER_GPU:-L40S}
      # the independent reviewer: a vision model is advised (see .env.example)
      WHATIF_REVIEWER_ENABLED: ${WHATIF_REVIEWER_ENABLED:-}
      WHATIF_REVIEW_PROVIDER: ${WHATIF_REVIEW_PROVIDER:-}
      WHATIF_REVIEW_BASE_URL: ${WHATIF_REVIEW_BASE_URL:-}
      WHATIF_REVIEW_MODEL: ${WHATIF_REVIEW_MODEL:-}
      WHATIF_REVIEW_API_KEY: ${WHATIF_REVIEW_API_KEY:-}
      WHATIF_REVIEW_MAX_ROUNDS: ${WHATIF_REVIEW_MAX_ROUNDS:-3}
      WHATIF_REVIEW_MAX_TOKENS: ${WHATIF_REVIEW_MAX_TOKENS:-12000}
      # the local app that owns the videos, the narrations and the TTS takes
      WHATIF_NOUVEAU_URL: ${WHATIF_NOUVEAU_URL:-http://127.0.0.1:8005}
      WHATIF_NARRATION_MODEL: ${WHATIF_NARRATION_MODEL:-deepseek/deepseek-v4-flash-0731}
      # Persist Google Antigravity (agy) OAuth token on disk (/data/.gemini) instead of desktop keyring
      GEMINI_FORCE_FILE_STORAGE: "true"
    volumes:
      - ./data:/data                                   # projects, sqlite, git checkpoints (+ data/providers.json)
      # décommenter après `cp providers.example.json providers.json`, ou placer directement data/providers.json déjà monté via ./data:/data
      # - ./providers.json:/app/providers.json:ro
      - ${HOME}/.codex:/home/node/.codex               # ChatGPT / Codex OAuth session (auth.json)
      - ${HOME}/.local/bin/agy:/usr/local/bin/agy:ro   # Google Antigravity CLI binary
    shm_size: "1gb"
    restart: unless-stopped
